name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify dylib
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve iPhoneOS SDK
        id: sdk
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "sdk_path=$SDK_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved SDK: $SDK_PATH"

      # Local toolchain is clang + ld64.lld (LLVM). Homebrew LLVM ships both,
      # giving byte-identical linker behavior (CHAINED_FIXUPS + __init_offsets).
      - name: Install LLVM (clang + ld64.lld)
        run: |
          brew install llvm
          echo "--- llvm bin (ld* lld*) ---"
          ls -1 "$(brew --prefix llvm)/bin" | grep -iE 'ld|lld' || true

      - name: Compile object (clang -c)
        run: |
          LLVM_BIN="$(brew --prefix llvm)/bin"
          SDK_PATH="${{ steps.sdk.outputs.sdk_path }}"
          "$LLVM_BIN/clang" \
            -target arm64-apple-ios16.5 \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc -fno-stack-protector -fvisibility=hidden \
            -c src/hook.m -o hook.o

      - name: Link dylib (ld64.lld)
        run: |
          LLVM_BIN="$(brew --prefix llvm)/bin"
          SDK_PATH="${{ steps.sdk.outputs.sdk_path }}"
          mkdir -p out
          "$LLVM_BIN/ld64.lld" \
            -dylib \
            -arch arm64 \
            -platform_version ios 16.5 0 \
            -isysroot "$SDK_PATH" \
            -undefined dynamic_lookup \
            -o out/NoBrandSplash.dylib \
            hook.o

      - name: Verify Mach-O structure
        run: |
          python3 tools/check_macho.py out/NoBrandSplash.dylib
          file out/NoBrandSplash.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoBrandSplash.dylib
          path: out/NoBrandSplash.dylib
          if-no-files-found: error
